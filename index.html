<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARK-JOHN GROUP OF COMPANIES</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
</head>

<body>
  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">UX Message</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="messenger" class="modal-body">
        </div>
        <div class="modal-footer">
          <!-- <button id="Close" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button> -->
          <button id="proceed" type="button" class="btn btn-primary"><a style="text-decoration: none; color: white;" href="dashboard.html">Proceed to
            Dashboard</a> </button>
        </div>
      </div>
    </div>
  </div>
  </div>


  <div class="parent">
    <h1>Sign Up</h1>
    <form action="">

      <label for="">Input Username</label>
      <input type="text" name="" id="username" placeholder="Your Desired Username">

      <br>
      <label for="">Input Gmail Address</label>
      <input type="gmail" name="" id="gmail" placeholder="Your G-mail address">


      <br>
      <label for="">Input Your Password</label>
      <input type="password" name="" id="password" placeholder="Your password">

    </form>
    <div style="display: flex; " class="but">

      <button onclick="signUp()">Sign-Up</button>
      <button style="display: none; background-color: green;" id="button2" onclick="signUp()" data-bs-toggle="modal"
      data-bs-target="#exampleModal">Confirm Information</button>
    </div>
    <div id="show" class="show"></div>
  </div>
</body>
<script src="script.js"></script>

</html>
